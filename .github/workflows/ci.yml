name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Phase 2 revised-data benchmark
        if: github.event_name == 'pull_request' && github.head_ref == 'phase2-research'
        run: python scripts/evaluate_phase2.py
      - name: Verify ALFRED credential
        if: github.event_name == 'pull_request' && github.head_ref == 'phase2-research'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "ALFRED_CREDENTIAL_CONFIGURED=false"
            exit 2
          fi
          echo "ALFRED_CREDENTIAL_CONFIGURED=true"
      - name: Build clean ALFRED point-in-time history
        if: github.event_name == 'pull_request' && github.head_ref == 'phase2-research'
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          rm -rf data/point_in_time
          python scripts/build_alfred_macro_history.py \
            --decision-start 2011-05-31 \
            --decision-end 2026-07-31 \
            --sleep 0.55
          cat data/point_in_time/alfred_macro_metadata.json
      - name: Run ALFRED point-in-time benchmark
        if: github.event_name == 'pull_request' && github.head_ref == 'phase2-research'
        run: |
          python scripts/evaluate_point_in_time.py
          cat data/phase2/point_in_time_benchmark.json
