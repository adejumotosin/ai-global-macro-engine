name: Phase 2 revised-data benchmark

on:
  workflow_dispatch:
  push:
    branches: [phase2-research]
    paths:
      - ".github/workflows/phase2-benchmark.yml"

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Run tests
        run: pytest -q
      - name: Run Phase 2 benchmark
        run: python scripts/evaluate_phase2.py
      - name: Commit benchmark report
        run: |
          git config user.name "macro-engine-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/phase2/revised_data_benchmark.json
          git commit -m "data: record Phase 2 revised-data benchmark" || true
          git pull --rebase origin phase2-research
          git push origin HEAD:phase2-research
