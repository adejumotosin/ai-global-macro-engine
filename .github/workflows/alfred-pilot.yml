name: ALFRED point-in-time pilot

on:
  workflow_dispatch:
  push:
    branches: [phase2-research]
    paths:
      - ".github/workflows/alfred-pilot.yml"

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-research
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -e '.[dev]'
      - name: Check ALFRED credential
        id: credential
        shell: bash
        run: |
          if [ -z "$FRED_API_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "FRED_API_KEY is not configured; ALFRED pilot was safely skipped."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "FRED_API_KEY is configured."
          fi
      - name: Run three-date ALFRED pilot
        if: steps.credential.outputs.available == 'true'
        run: python scripts/build_alfred_macro_history.py --decision-start 2024-01-31 --decision-end 2024-03-31 --max-dates 3 --sleep 0.05
      - name: Commit pilot evidence
        if: steps.credential.outputs.available == 'true'
        run: |
          git config user.name "macro-engine-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/point_in_time/alfred_macro_features.csv data/point_in_time/alfred_macro_metadata.json
          git commit -m "data: record ALFRED point-in-time pilot" || true
          git pull --rebase origin phase2-research
          git push origin HEAD:phase2-research
